name: Feature request
description: Suggest something mac-pulse should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        mac-pulse stays without root, a privileged helper, a kernel or network extension and telemetry.
        Requests that need one of these (fan control, a firewall, blocking connections) will be declined.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Another app, a command, nothing.
